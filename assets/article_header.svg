<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="110" width="6" height="150" rx="3" fill="#3b82f6"/>
  <text x="110" y="170" font-size="84" font-weight="800" fill="#f8fafc">DraftStudio</text>
  <text x="110" y="230" font-size="36" font-weight="500" fill="#cbd5e1">Five AI agents. One quality gate.</text>
  <text x="110" y="290" font-size="24" fill="#94a3b8">From raw client request to a researched, reviewed deliverable.</text>

  <g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)">
    <path d="M250 440 H290"/><path d="M490 440 H530"/><path d="M730 440 H770"/><path d="M970 440 H1010"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <rect x="80" y="400" width="170" height="80" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="165" y="448" fill="#1e3a8a">Intake</text>
    <rect x="290" y="400" width="200" height="80" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="390" y="448" fill="#14532d">Research</text>
    <rect x="530" y="400" width="200" height="80" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="3"/><text x="630" y="448" fill="#713f12">Draft</text>
    <rect x="770" y="400" width="200" height="80" rx="14" fill="#fae8ff" stroke="#c026d3" stroke-width="3"/><text x="870" y="448" fill="#701a75">Review</text>
    <rect x="1010" y="400" width="190" height="80" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="1105" y="448" fill="#7c2d12">Dispatch</text>
  </g>
  <text x="870" y="516" font-size="18" font-weight="600" fill="#f87171" text-anchor="middle">score ≥ 80 or it doesn't ship</text>

  <g font-size="20" fill="#94a3b8">
    <text x="80" y="628">Source-available · Python harness + n8n workflow · Groq + OpenRouter</text>
    <text x="80" y="660" fill="#64748b">github.com/mattsebastianh/DraftStudio</text>
  </g>
</svg>
