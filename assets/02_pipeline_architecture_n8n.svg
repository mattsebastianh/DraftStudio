<text x="60" y="934" font-size="12" fill="#475569">Models: Groq openai/gpt-oss-120b (Intake, Research, Draft, Dispatch) with OpenRouter openai/gpt-oss-20b fallback · ReviewAgent: OpenRouter qwen/qwen3-235b-a22b-2507 with Groq llama-3.3-70b-versatile fallback · every agent has two providers · retries 5 × 5 s per agent</text>
<text x="60" y="955" font-size="12" fill="#475569">Checks and verdict use Edit Fields + IF expressions only (no Code node) · Structured Output Parser on Intake, Draft, Review, Dispatch · long Telegram deliverables are sent in up to 3 messages</text>
<text x="60" y="976" font-size="12" fill="#dc2626">Before activating: create the DraftStudio Webhook credential (Header Auth, X-API-Key) and set the Telegram chat-id allowlist. Webhook auth and the stricter gate live-tested on n8n 2.x; the Groq reviewer fallback and failure branches are not yet run live.</text>
