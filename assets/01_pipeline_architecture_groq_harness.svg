<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1440" height="800" fill="#f8fafc"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">DraftStudio — Agent Pipeline Architecture</text>
  <text x="40" y="74" font-size="13" fill="#64748b">IntakeAgent → ResearchAgent → DraftAgent ⇄ ReviewAgent → DispatchAgent · max 3 revision cycles · approve at score ≥ 80 and no critical issue · every hop schema-validated</text>

  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <path d="M200 335 H240"/>
    <path d="M320 300 V185 H480"/>
    <path d="M320 370 V440 H760 V370"/>
    <path d="M640 175 H800 V300"/>
    <path d="M740 300 V205 H640" stroke-dasharray="6 4"/>
    <path d="M880 335 H960"/>
    <path d="M1000 300 V110 H560 V150" stroke-dasharray="6 4"/>
    <path d="M1120 335 H1200"/>
    <path d="M1280 370 V500 H280 V370"/>
  </g>
  <g fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#r)">
    <path d="M1040 370 V400 H840 V370"/>
    <path d="M1100 370 V560"/>
  </g>

  <g font-size="12" fill="#475569">
    <text x="252" y="325" text-anchor="start"></text>
    <text x="330" y="175">structured brief</text>
    <text x="400" y="432">brief only (no research needed)</text>
    <text x="660" y="168">dossier (sourced)</text>
    <text x="650" y="222">gap request</text>
    <text x="885" y="326">draft</text>
    <text x="700" y="102">fact gaps</text>
    <text x="1127" y="326">score ≥ 80</text>
    <text x="640" y="494">delivery confirmation</text>
  </g>
  <g font-size="12" fill="#dc2626">
    <text x="860" y="394">revision (score &lt; 80)</text>
    <text x="1110" y="470">cycle 3 fails → escalate</text>
  </g>

  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="40" y="300" width="160" height="70" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="120" y="341" fill="#0f172a">Client</text>
    <rect x="240" y="300" width="160" height="70" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="341" fill="#1e3a8a">IntakeAgent</text>
    <rect x="480" y="150" width="160" height="70" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="560" y="191" fill="#14532d">ResearchAgent</text>
    <rect x="720" y="300" width="160" height="70" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="800" y="341" fill="#713f12">DraftAgent</text>
    <rect x="960" y="300" width="160" height="70" rx="12" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
    <text x="1040" y="341" fill="#701a75">ReviewAgent</text>
    <rect x="1200" y="300" width="160" height="70" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="1280" y="341" fill="#7c2d12">DispatchAgent</text>
    <rect x="1000" y="560" width="200" height="60" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1100" y="595" fill="#7f1d1d">Escalate to human</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="320" y="358">classify + route</text>
    <text x="560" y="208">search + verified sources</text>
    <text x="800" y="358">write deliverable</text>
    <text x="1040" y="358">LLM score + code checks</text>
    <text x="1280" y="358">package + hand off</text>
  </g>

  <rect x="40" y="572" width="860" height="130" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="60" y="598" font-size="14" font-weight="600" fill="#0f172a">Runtime — Groq primary, OpenRouter fallback (OpenAI-compatible APIs, keys from .env)</text>
  <text x="60" y="620" font-size="12" fill="#475569">Primary: openai/gpt-oss-120b   →   Fallback (daily token quota exhausted): qwen/qwen3.8-27b</text>
  <text x="60" y="638" font-size="12" fill="#475569">Groq unreachable or blocked (403, outage)   →   rest of the run on OpenRouter (OPENROUTER_PRIMARY_MODEL)</text>
  <text x="60" y="658" font-size="12" fill="#475569">Structured replies: json_schema on Groq, JSON mode + local validation on OpenRouter · invalid reply → retry with errors (max 2)</text>
  <text x="60" y="678" font-size="12" fill="#475569">Every agent = system_prompt.txt + tools.json + output_schema.json · wired by wires/*.yaml · agents/registry.yaml</text>

  <rect x="920" y="650" width="440" height="122" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="940" y="676" font-size="14" font-weight="600" fill="#0f172a">Checks in code (harness/)</text>
  <text x="940" y="698" font-size="12" fill="#475569">• every hop message validated against wires/*.yaml</text>
  <text x="940" y="716" font-size="12" fill="#475569">• research: web_search + fetch_url (Tavily); findings keep only</text>
  <text x="950" y="732" font-size="12" fill="#475569">URLs the tools returned, else dropped as gaps</text>
  <text x="940" y="750" font-size="12" fill="#475569">• review: 5 deterministic checks + code-computed verdict</text>
  <text x="940" y="766" font-size="12" fill="#475569">• run log written even when a step fails</text>
</svg>
