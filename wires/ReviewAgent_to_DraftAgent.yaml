wire:
  id: ReviewAgent_to_DraftAgent
  version: "1.1"
  created: 2026-04-13
  updated: 2026-10-03

sender:
  agent: ReviewAgent
  trigger_condition: "Quality review found issues requiring revision (status = revision_required)"
  trigger_event: revision_required

receiver:
  agent: DraftAgent
  entry_point: receive_from_ReviewAgent

message_schema:
  type: object
  additionalProperties: false
  required:
    - draft_title
    - issues
    - revision_round
  properties:
    draft_title:
      type: string
      description: "Title of the draft being sent back for revision"
      example: "EU AI Act Compliance Guide"
    issues:
      type: array
      description: "Specific issues to address in the revision"
      items:
        type: object
        properties:
          severity:
            type: string
            enum: ["critical", "high", "medium", "low"]
          category:
            type: string
            example: "completeness"
          description:
            type: string
            example: "Missing documentation requirements section"
          suggested_fix:
            type: string
            example: "Add a dedicated section covering required documentation"
    revision_round:
      type: integer
      description: "Current revision cycle number"
      example: 1
    brief:
      type: object
      description: "The original brief, so the revision keeps every requirement in view"
    previous_draft:
      type: object
      description: "The draft being revised"
      properties:
        title:
          type: string
        content:
          type: string
        format:
          type: string
        unsupported:
          type: array
          items:
            type: string
        word_count:
          type: integer

failure_handling:
  on_timeout:
    action: retry
    max_retries: 3
    backoff_seconds: 5
  on_error:
    action: escalate
    escalate_to: "human"
  on_max_retries_exceeded:
    action: alert_human
    message: "Wire ReviewAgent_to_DraftAgent failed after 3 retries"

metadata:
  description: "Sends revision requests from ReviewAgent back to DraftAgent with specific issues to address"
  data_sensitivity: internal
  changelog:
    - "1.1 (2026-10-03): added brief and previous_draft (DraftAgent needs the text it revises); top-level fields closed"