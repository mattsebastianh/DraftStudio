wire:
  id: ReviewAgent_to_DispatchAgent
  version: "1.2"
  created: 2026-04-13
  updated: 2026-10-03

sender:
  agent: ReviewAgent
  trigger_condition: "Deliverable passes quality review (status = approved, no critical/high issues)"
  trigger_event: deliverable_approved

receiver:
  agent: DispatchAgent
  entry_point: receive_from_ReviewAgent

message_schema:
  type: object
  additionalProperties: false
  required:
    - draft
  properties:
    draft:
      type: object
      description: "The approved draft deliverable"
      properties:
        title:
          type: string
          example: "EU AI Act Compliance Guide"
        content:
          type: string
          example: "# EU AI Act Compliance Guide..."
        format:
          type: string
          example: "markdown"
    review_summary:
      type: object
      description: "Summary of the review result"
      properties:
        score:
          type: integer
          example: 87
        dimension_scores:
          type: object
          description: "Per-dimension quality scores (0-100)"
          properties:
            clarity:
              type: integer
              example: 90
            accuracy:
              type: integer
              example: 85
            completeness:
              type: integer
              example: 88
            tone_alignment:
              type: integer
              example: 86
        revision_rounds:
          type: integer
          example: 1
        review_status:
          type: string
          enum: ["approved"]
          description: "Always approved on this wire; DispatchAgent never packages anything else"
    sources:
      type: array
      description: "Research sources used by the draft, for the package's source list"
      items:
        type: object
        required:
          - url
        properties:
          title:
            type: string
          url:
            type: string
    client_preferences:
      type: object
      description: "Client formatting and delivery preferences (not sent by the harness yet)"
      properties:
        format:
          type: string
        include_sources:
          type: boolean
        include_revision_history:
          type: boolean
    client_id:
      type: string
      description: "Client identifier for tracking and delivery (not sent by the harness yet)"

failure_handling:
  on_timeout:
    action: retry
    max_retries: 3
    backoff_seconds: 5
  on_error:
    action: escalate
    escalate_to: "human"
  on_max_retries_exceeded:
    action: alert_human
    message: "Wire ReviewAgent_to_DispatchAgent failed after 3 retries"

metadata:
  description: "Transfers approved deliverables from ReviewAgent to DispatchAgent for packaging and client delivery"
  data_sensitivity: internal
  changelog:
    - "1.2 (2026-10-03): added review_summary.review_status and sources; documented client_preferences and client_id, which DispatchAgent's tools already accepted; top-level fields closed"