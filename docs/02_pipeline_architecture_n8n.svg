<text x="40" y="74" font-size="13" fill="#64748b">Built-in n8n nodes only · solid = data flow · dashed = tool / optional · red = revision loop and escalation · approve at score ≥ 80, no critical issue, no placeholder · max 3 revision cycles</text>
