<text x="60" y="646" font-size="12" fill="#475569">Groq Chat Model openai/gpt-oss-120b (primary) · fallback qwen/qwen3.8-27b via needsFallback (ai_languageModel index 1)</text>
<text x="60" y="666" font-size="12" fill="#475569">Structured Output Parser on Intake, Draft, Review, Dispatch · ResearchAgent adds Wikipedia + Tavily Search tools (max 6 tool calls)</text>
<text x="60" y="686" font-size="12" fill="#475569">Checks and verdict use Edit Fields + IF expressions only (no Code node) · Draft loops back through Prepare Revision</text>
<text x="60" y="716" font-size="12" fill="#dc2626">Before activating: set authentication on the Webhook node. Validated against n8n 2.41.2 sources; not yet run in a live n8n.</text>
